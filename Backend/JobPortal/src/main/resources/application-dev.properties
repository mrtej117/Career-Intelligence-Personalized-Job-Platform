# ═══════════════════════════════════════════════════════════════════════
#  application-dev.properties — LOCAL DEVELOPMENT PROFILE
# ═══════════════════════════════════════════════════════════════════════

# ─── Server ──────────────────────────────────────────────────────────
server.port=8080

# ─── H2 In-Memory Database ──────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:jobportaldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ─── JPA / Hibernate ────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ─── H2 Console (accessible at http://localhost:8080/h2-console) ────
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ─── Email (log-only for local dev — no real SMTP required) ─────────
# Using a dummy host. EmailServiceImpl catches all send failures
# gracefully and logs them, so the app won't crash.
spring.mail.host=localhost
spring.mail.port=25
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# ─── Rate Limiting (relaxed for development) ────────────────────────
auth.ratelimit.requests=100
auth.ratelimit.window-minutes=1

# ─── Logging ────────────────────────────────────────────────────────
logging.level.com.job=DEBUG
logging.level.org.springframework.security=DEBUG

# ─── Demo Seed Data ─────────────────────────────────────────────────
# Set to true to populate the database with realistic demo data on startup.
# The seeder is idempotent — it won't create duplicates on restart.
app.seed.enabled=true